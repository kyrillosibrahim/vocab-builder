<!-- Premium Glass Header -->
<header class="header">
  <div class="header-inner">
    <!-- Logo -->
    <a routerLink="/add" class="logo">
      <div class="logo-icon">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        </svg>
      </div>
      <span class="logo-text">Vocab<span class="logo-accent"> K-Y  </span></span>
    </a>

    <!-- Tab Navigation -->
    <nav class="tab-nav">
      <a routerLink="/add" routerLinkActive="active" class="tab-link">
        <div class="tab-icon">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
        </div>
        <span>Add Word</span>
      </a>
      <a routerLink="/words" routerLinkActive="active" class="tab-link">
        <div class="tab-icon">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
          </svg>
        </div>
        <span>My Words</span>
      </a>
    </nav>
  </div>
</header>

<!-- Main Content -->
<main style="min-height: calc(100vh - 72px); padding-bottom: 40px; background-color: #F5EDE0;">
  <router-outlet />
</main>
